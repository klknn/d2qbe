<!doctype html>
<meta charset="utf-8">
<title>d2qbe Wasm browser demo</title>
<style>
  body { background: #10151f; color: #eaf0ff; font: 18px/1.5 system-ui, sans-serif; margin: 2rem; }
  output { color: #75e39a; font-size: 2rem; font-weight: 700; }
  input { width: min(28rem, 90vw); }
  code { color: #a8d7ff; }
</style>
<h1>d2qbe Wasm browser demo</h1>
<p>Move the value. The compiled Wasm module calls browser-provided <code>env.host_value</code> and returns <code>n² + 1</code>.</p>
<label>Input <input type="range" id="value" min="0" max="100" value="7"></label>
<p><span id="input-value">7</span>² + 1 = <output id="result">…</output></p>
<p id="status">Loading demo.wasm…</p>
<script type="module">
  const value = document.querySelector("#value");
  const inputValue = document.querySelector("#input-value");
  const result = document.querySelector("#result");
  const status = document.querySelector("#status");
  const bytes = await (await fetch("../../tmp_wasm_browser/demo.wasm")).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(bytes, {
    env: { host_value() { return Number(value.value); } },
  });
  function render() {
    inputValue.textContent = value.value;
    result.textContent = instance.exports.main();
  }
  value.addEventListener("input", render);
  render();
  status.textContent = "Wasm module loaded successfully.";
</script>
